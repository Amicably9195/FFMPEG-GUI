name: Build Drawing2CAD exe

on:
  workflow_dispatch:
  push:
    branches: [claude/drawing-scan-to-cad-v1l3ff]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install core dependencies
        run: |
          pip install numpy ezdxf pytesseract pillow
          pip install --no-deps opencv-contrib-python-headless
          # tests.py + benchmark.py need only the above; see requirements.txt
          # for the full runtime set and the opencv-contrib install order.

      - name: Run tests
        run: python tests.py

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller customtkinter tkinterdnd2 numpy ezdxf pytesseract pillow pymupdf rapidocr_onnxruntime
          pip uninstall -y opencv-python opencv-python-headless
          pip install --force-reinstall --no-deps opencv-contrib-python-headless

      - name: Build exe
        run: pyinstaller Drawing2CAD.spec

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: Drawing2CAD-windows
          path: dist/Drawing2CAD.exe
